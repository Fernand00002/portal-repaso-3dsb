<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB // Repaso 3.º DS</title>
    <!-- Fuentes góticas / de alta gama -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;850&family=Syne+Mono&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030407;
            --surface: rgba(10, 14, 23, 0.85);
            --border: #1a233a;
            --border-glow: #e2e8f0;
            --text: #c2c7d0;
            --text-heading: #f8fafc;
            --accent: #f8fafc;
            --font-gothic: 'Cinzel', serif;
            --font-mono: 'Syne Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Canvas de fondo Matrix */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.3;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 20px;
            background: rgba(3, 4, 7, 0.6);
            backdrop-filter: blur(4px);
        }

        h1 {
            font-family: var(--font-gothic);
            font-weight: 850;
            font-size: clamp(28px, 4vw, 42px);
            color: var(--text-heading);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .badge {
            font-family: var(--font-mono);
            font-size: 13px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 14px;
            color: var(--accent);
            border-radius: 2px;
        }

        p.lead {
            font-size: 15px;
            color: #8b9bb4;
            font-weight: 300;
        }

        /* Botones de Filtro */
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            font-family: var(--font-mono);
            font-size: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 16px;
            color: var(--text);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            backdrop-filter: blur(6px);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--text-heading);
            color: var(--bg);
            border-color: var(--text-heading);
        }

        /* --- RUEDA DE MUNDOS 3D (ESTILO GEOMETRY DASH WORLD) --- */
        .world-selector-container {
            position: relative;
            width: 100%;
            height: 380px;
            margin: 20px 0 40px;
            perspective: 1000px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-wheel {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .world-card {
            position: absolute;
            width: 280px;
            height: 320px;
            left: 50%;
            top: 50%;
            margin-left: -140px;
            margin-top: -160px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.3s, box-shadow 0.3s;
            user-select: none;
            cursor: pointer;
        }

        .world-card.active-world {
            border-color: var(--border-glow);
            box-shadow: 0 0 25px rgba(248, 250, 252, 0.2);
        }

        .world-number {
            font-family: var(--font-mono);
            font-size: 11px;
            color: #64748b;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .world-title {
            font-family: var(--font-gothic);
            font-size: 16px;
            color: var(--text-heading);
            margin: 10px 0;
            line-height: 1.3;
        }

        .world-desc {
            font-size: 13px;
            color: var(--text);
            font-weight: 300;
            line-height: 1.5;
        }

        .world-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-heading);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
        }

        .world-nav-btn:hover {
            background: var(--text-heading);
            color: var(--bg);
        }

        .nav-prev { left: 10px; }
        .nav-next { right: 10px; }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .tag {
            font-family: var(--font-mono);
            font-size: 10px;
            background: rgba(3, 4, 7, 0.9);
            border: 1px solid var(--border);
            padding: 3px 6px;
            color: #94a3b8;
            border-radius: 2px;
        }

        footer {
            margin-top: 60px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 12px;
            color: #475569;
            background: rgba(3, 4, 7, 0.6);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <header>
            <div>
                <h1>Portal de Repaso</h1>
                <p class="lead">Sistema de Archivos y Módulos Académicos // 3.º DS B</p>
            </div>
            <div class="badge">WORLD // v0.7-GD-3D</div>
        </header>

        <!-- Filtros por Docente -->
        <div class="filters">
            <button class="filter-btn active" data-filter="todos">Todos los Mundos</button>
            <button class="filter-btn" data-filter="Arcides Canales">Arcides Canales</button>
            <button class="filter-btn" data-filter="Javier Mineros">Javier Mineros</button>
        </div>

        <!-- Rueda 3D de Mundos Estilo GD World -->
        <div class="world-selector-container">
            <button class="world-nav-btn nav-prev" id="prevBtn">◀</button>
            <div class="carousel-wheel" id="wheel"></div>
            <button class="world-nav-btn nav-next" id="nextBtn">▶</button>
        </div>

        <footer>
            INDEL // DESARROLLO DE SOFTWARE
        </footer>
    </div>

    <script src="data/modulos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const wheel = document.getElementById("wheel");
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");
            const botonesFiltro = document.querySelectorAll(".filter-btn");

            let currentDegree = 0;
            let filteredData = [...modulosData];

            function renderWheel(filter = "todos") {
                filteredData = filter === "todos" 
                    ? modulosData 
                    : modulosData.filter(m => m.docente === filter);

                wheel.innerHTML = "";
                const total = filteredData.length;
                if (total === 0) return;

                const angleStep = 360 / total;
                const radius = Math.max(280, total * 45); // Radio responsivo según cantidad de módulos

                filteredData.forEach((mod, index) => {
                    const angle = index * angleStep;
                    const card = document.createElement("div");
                    card.className = "world-card";
                    card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;

                    card.innerHTML = `
                        <div>
                            <span class="world-number">WORLD 0${index + 1} // ${mod.docente}</span>
                            <h3 class="world-title">${mod.nombre}</h3>
                            <p class="world-desc">${mod.resumen}</p>
                        </div>
                        <div class="tags">
                            ${mod.herramientas.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                    `;

                    wheel.appendChild(card);
                });

                currentDegree = 0;
                wheel.style.transform = `rotateY(0deg)`;
            }

            function rotateWheel(direction) {
                const total = filteredData.length;
                if (total === 0) return;
                const angleStep = 360 / total;

                if (direction === "next") {
                    currentDegree -= angleStep;
                } else {
                    currentDegree += angleStep;
                }

                wheel.style.transform = `rotateY(${currentDegree}deg)`;
            }

            prevBtn.addEventListener("click", () => rotateWheel("prev"));
            nextBtn.addEventListener("click", () => rotateWheel("next"));

            // Teclas de flecha izquierda / derecha para girar la rueda
            document.addEventListener("keydown", (e) => {
                if (e.key === "ArrowLeft") rotateWheel("prev");
                if (e.key === "ArrowRight") rotateWheel("next");
            });

            // Filtros de docente
            botonesFiltro.forEach(btn => {
                btn.addEventListener("click", () => {
                    botonesFiltro.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    renderWheel(btn.getAttribute("data-filter"));
                });
            });

            renderWheel("todos");

            // Matrix Rain Effect
            const canvas = document.getElementById("matrix-canvas");
            const ctx = canvas.getContext("2d");

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener("resize", resizeCanvas);

            const chars = "0123456789ABCDEF<>[]{}/\\;:#$%&*+=-";
            const fontSize = 14;
            let columns = Math.floor(canvas.width / fontSize);
            let drops = Array(columns).fill(1);

            function drawMatrix() {
                ctx.fillStyle = "rgba(3, 4, 7, 0.08)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#38bdf8";
                ctx.font = `${fontSize}px 'Syne Mono', monospace`;

                for (let i = 0; i < drops.length; i++) {
                    const text = chars.charAt(Math.floor(Math.random() * chars.length));
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }
            setInterval(drawMatrix, 35);
        });
    </script>
</body>
</html>

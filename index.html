<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB // Repaso 3.º DS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;850&family=Syne+Mono&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        [data-theme="dark"] {
            --bg: #020204;
            --surface: #0a0507;
            --surface-card: rgba(12, 5, 8, 0.95);
            --border: #2a0b12;
            --border-glow: #ef4444; /* Rojo infernal */
            --text: #d1d5db;
            --text-heading: #fff1f2;
            --accent: #ef4444;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-card: rgba(255, 255, 255, 0.95);
            --border: #cbd5e1;
            --border-glow: #dc2626;
            --text: #334155;
            --text-heading: #0f172a;
            --accent: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.25s, color 0.25s, border-color 0.25s; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Canvas de Partículas Rojas e Infierno */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.35;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--surface);
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.15);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-weight: 850;
            font-size: clamp(24px, 3.5vw, 36px);
            color: var(--text-heading);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        }

        .top-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-control {
            font-family: 'Syne Mono', monospace;
            font-size: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px 14px;
            color: var(--text-heading);
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-control:hover { border-color: var(--border-glow); box-shadow: 0 0 12px var(--border-glow); }

        .filters-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .search-input {
            flex: 1;
            min-width: 240px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 16px;
            color: var(--text-heading);
            font-family: 'Inter', sans-serif;
            border-radius: 4px;
            outline: none;
        }
        .search-input:focus { border-color: var(--border-glow); box-shadow: 0 0 12px rgba(239, 68, 68, 0.4); }

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            font-family: 'Syne Mono', monospace;
            font-size: 11px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 16px;
            color: var(--text);
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--text-heading);
            color: var(--bg);
            border-color: var(--text-heading);
            box-shadow: 0 0 15px var(--border-glow);
        }

        /* --- SLIDER GÓTICO ROJO/NEGRO --- */
        .slider-wrapper {
            position: relative;
            margin-bottom: 35px;
        }

        .slider-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 15px 5px;
            scrollbar-width: thin;
            scrollbar-color: var(--border-glow) var(--surface);
        }

        .slider-container::-webkit-scrollbar { height: 6px; }
        .slider-container::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 4px; }

        .card {
            min-width: 310px;
            max-width: 320px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            border-color: var(--border-glow);
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.35);
        }

        .card.completed {
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
        }
        .card.completed::after {
            content: "✓ COMPLETADO";
            position: absolute;
            top: 15px;
            right: 15px;
            font-family: 'Syne Mono', monospace;
            font-size: 10px;
            color: #22c55e;
            letter-spacing: 1px;
        }

        .world-number {
            font-family: 'Syne Mono', monospace;
            font-size: 11px;
            color: #991b1b;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .world-title {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            color: var(--text-heading);
            margin: 10px 0;
            line-height: 1.4;
        }

        .world-desc {
            font-size: 13px;
            color: var(--text);
            font-weight: 300;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-heading);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9);
        }
        .nav-arrow:hover {
            background: var(--text-heading);
            color: var(--bg);
            border-color: var(--text-heading);
            box-shadow: 0 0 20px var(--border-glow);
        }

        .arrow-left { left: -15px; }
        .arrow-right { right: -15px; }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }

        .tag {
            font-family: 'Syne Mono', monospace;
            font-size: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 3px 8px;
            color: var(--text);
            border-radius: 2px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Syne Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            color: var(--text-heading);
        }
        .checkbox-container input { width: 16px; height: 16px; cursor: pointer; accent-color: #ef4444; }

        /* QUIZ INTERACTIVO INFERNAL */
        .quiz-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.1);
        }

        .quiz-title {
            font-family: 'Cinzel', serif;
            font-size: 17px;
            color: var(--text-heading);
            margin-bottom: 12px;
        }

        .quiz-question {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 14px;
            color: var(--text-heading);
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .quiz-option-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 10px 14px;
            text-align: left;
            color: var(--text);
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }
        .quiz-option-btn:hover { border-color: var(--border-glow); box-shadow: 0 0 12px rgba(239, 68, 68, 0.4); }

        .quiz-feedback {
            font-family: 'Syne Mono', monospace;
            font-size: 13px;
            margin-top: 8px;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-family: 'Syne Mono', monospace;
            font-size: 11px;
            color: #7f1d1d;
        }
    </style>
</head>
<body>

    <!-- CANVAS INFERNAL (LLUVIA ROJA + PARTÍCULAS) -->
    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <header>
            <div>
                <h1>Mi Portal</h1>
                <p style="font-size: 12px; color: #991b1b; margin-top: 4px;">Tu espacio de aprendizaje tecnológico</p>
            </div>
            <div class="top-controls">
                <button class="btn-control" id="themeToggle">🌓 Modo</button>
            </div>
        </header>

        <!-- Buscador y Filtros -->
        <div class="filters-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar módulo o tecnología en tiempo real...">
            <div class="filters">
                <button class="filter-btn active" data-filter="todos">Todos</button>
                <button class="filter-btn" data-filter="Arcides Canales">Arcides Canales</button>
                <button class="filter-btn" data-filter="Javier Mineros">Javier Mineros</button>
            </div>
        </div>

        <!-- SLIDER NÍTRIDO DINÁMICO -->
        <div class="slider-wrapper">
            <button class="nav-arrow arrow-left" id="scrollLeft">◀</button>
            <div id="modulesContainer" class="slider-container"></div>
            <button class="nav-arrow arrow-right" id="scrollRight">▶</button>
        </div>

        <!-- Quiz Interactivo -->
        <div class="quiz-section">
            <div class="quiz-title">// Quiz Técnico Infernal (Retroalimentación Inmediata)</div>
            <div class="quiz-question" id="quizQuestion">Cargando pregunta...</div>
            <div class="quiz-options" id="quizOptions"></div>
            <div class="quiz-feedback" id="quizFeedback"></div>
        </div>

        <footer>
            INDEL // DESARROLLO DE SOFTWARE // 2026
        </footer>
    </div>

    <script src="data/modulos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("modulesContainer");
            const searchInput = document.getElementById("searchInput");
            const filterBtns = document.querySelectorAll(".filter-btn");
            const themeToggle = document.getElementById("themeToggle");
            const scrollLeft = document.getElementById("scrollLeft");
            const scrollRight = document.getElementById("scrollRight");

            let currentFilter = "todos";
            let searchTerm = "";

            const savedTheme = localStorage.getItem("portal_theme") || "dark";
            document.documentElement.setAttribute("data-theme", savedTheme);

            themeToggle.addEventListener("click", () => {
                const current = document.documentElement.getAttribute("data-theme");
                const next = current === "dark" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", next);
                localStorage.setItem("portal_theme", next);
            });

            scrollLeft.addEventListener("click", () => {
                container.scrollBy({ left: -330, behavior: 'smooth' });
            });
            scrollRight.addEventListener("click", () => {
                container.scrollBy({ left: 330, behavior: 'smooth' });
            });

            function getCompletedModules() {
                return JSON.parse(localStorage.getItem("portal_completed") || "[]");
            }

            window.toggleComplete = (id) => {
                let completed = getCompletedModules();
                if (completed.includes(id)) {
                    completed = completed.filter(item => item !== id);
                } else {
                    completed.push(id);
                }
                localStorage.setItem("portal_completed", JSON.stringify(completed));
                renderModules();
            };

            function renderModules() {
                if (typeof modulosData === "undefined") return;
                const completedIds = getCompletedModules();

                const filteredData = modulosData.filter(mod => {
                    const matchesFilter = currentFilter === "todos" || mod.docente === currentFilter;
                    const query = searchTerm.toLowerCase();
                    const matchesSearch = mod.nombre.toLowerCase().includes(query) || 
                                          mod.resumen.toLowerCase().includes(query) ||
                                          mod.herramientas.some(t => t.toLowerCase().includes(query));
                    return matchesFilter && matchesSearch;
                });

                container.innerHTML = "";
                if (filteredData.length === 0) {
                    container.innerHTML = `<p style="text-align:center; padding: 40px; font-family:'Syne Mono'; color:#7f1d1d; width:100%;">No se encontraron módulos con esos criterios.</p>`;
                    return;
                }

                filteredData.forEach((mod) => {
                    const isDone = completedIds.includes(mod.id);
                    const card = document.createElement("div");
                    card.className = `card ${isDone ? 'completed' : ''}`;

                    card.innerHTML = `
                        <div>
                            <span class="world-number">DOCENTE: ${mod.docente}</span>
                            <h3 class="world-title">${mod.nombre}</h3>
                            <p class="world-desc">${mod.resumen}</p>
                        </div>
                        <div>
                            <div class="tags">
                                ${mod.herramientas.map(t => `<span class="tag">${t}</span>`).join('')}
                            </div>
                            <div class="card-footer">
                                <label class="checkbox-container">
                                    <input type="checkbox" ${isDone ? 'checked' : ''} onchange="window.toggleComplete(${mod.id})">
                                    <span>${isDone ? 'Repasado' : 'Marcar repaso'}</span>
                                </label>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            searchInput.addEventListener("input", (e) => {
                searchTerm = e.target.value;
                renderModules();
            });

            filterBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    filterBtns.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    currentFilter = btn.getAttribute("data-filter");
                    renderModules();
                });
            });

            renderModules();

            // Quiz Interactivo
            const quizData = [
                {
                    pregunta: "¿Qué componente define un acuerdo de nivel de servicio y tiempos de respuesta?",
                    opciones: ["Plantilla SLA", "Diagrama UML", "Script SQL"],
                    correcta: 0
                },
                {
                    pregunta: "¿Cuál es el propósito principal de un plan de contingencia operativo?",
                    opciones: ["Diseñar pantallas móviles", "Protocolos de acción ante fallas críticas", "Traducir textos técnicos"],
                    correcta: 1
                },
                {
                    pregunta: "¿Qué herramienta se utiliza para modelar estructuras de software y diagramas?",
                    opciones: ["UML", "Excel básico", "XAMPP local"],
                    correcta: 0
                }
            ];

            let currentQuizIndex = 0;
            const questionEl = document.getElementById("quizQuestion");
            const optionsEl = document.getElementById("quizOptions");
            const feedbackEl = document.getElementById("quizFeedback");

            function loadQuiz() {
                const q = quizData[currentQuizIndex];
                questionEl.textContent = `Pregunta ${currentQuizIndex + 1}: ${q.pregunta}`;
                optionsEl.innerHTML = "";
                feedbackEl.textContent = "";

                q.opciones.forEach((opt, idx) => {
                    const btn = document.createElement("button");
                    btn.className = "quiz-option-btn";
                    btn.textContent = opt;
                    btn.addEventListener("click", () => {
                        if (idx === q.correcta) {
                            feedbackEl.textContent = "✔ ¡Correcto! Alma salvada.";
                            feedbackEl.style.color = "#22c55e";
                            setTimeout(() => {
                                currentQuizIndex = (currentQuizIndex + 1) % quizData.length;
                                loadQuiz();
                            }, 2000);
                        } else {
                            feedbackEl.textContent = "✖ Incorrecto. Condenado al fracaso.";
                            feedbackEl.style.color = "#ef4444";
                        }
                    });
                    optionsEl.appendChild(btn);
                });
            }

            loadQuiz();

            // --- LLUVIA DE CÓDIGO ROJA + PARTÍCULAS INFERNALES ---
            const canvas = document.getElementById("matrix-canvas");
            const ctx = canvas.getContext("2d");

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener("resize", resizeCanvas);

            const chars = "0123456789ABCDEF<>[]{}/\\;:#$%&*+=-☠";
            const fontSize = 14;
            let columns = Math.floor(canvas.width / fontSize);
            let drops = Array(columns).fill(1);

            const mouse = { x: null, y: null, radius: 150 };
            window.addEventListener("mousemove", (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            window.addEventListener("mouseout", () => {
                mouse.x = null;
                mouse.y = null;
            });

            const particlesArray = [];
            for (let i = 0; i < 45; i++) {
                particlesArray.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speedX: (Math.random() - 0.5) * 0.8,
                    speedY: (Math.random() - 0.5) * 0.8
                });
            }

            function animate() {
                ctx.fillStyle = "rgba(2, 2, 4, 0.12)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Lluvia roja sangrienta
                ctx.fillStyle = "#ef4444";
                ctx.font = `${fontSize}px 'Syne Mono', monospace`;
                for (let i = 0; i < drops.length; i++) {
                    const text = chars.charAt(Math.floor(Math.random() * chars.length));
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }

                // Partículas rojas interactivas con el mouse
                particlesArray.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

                    ctx.fillStyle = "rgba(239, 68, 68, 0.6)";
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();

                    if (mouse.x !== null && mouse.y !== null) {
                        const dx = mouse.x - p.x;
                        const dy = mouse.y - p.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < mouse.radius) {
                            ctx.strokeStyle = `rgba(239, 68, 68, ${1 - distance / mouse.radius})`;
                            ctx.lineWidth = 0.8;
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.stroke();
                        }
                    }
                });

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>

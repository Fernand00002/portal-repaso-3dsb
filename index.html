<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB // Repaso 3.º DS</title>
    <!-- Fuentes góticas / de alta gama -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;850&family=Syne+Mono&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030407;
            --surface: #0a0e17;
            --border: #1a233a;
            --border-glow: #e2e8f0;
            --text: #c2c7d0;
            --text-heading: #f8fafc;
            --accent: #f8fafc;
            --font-gothic: 'Cinzel', serif;
            --font-mono: 'Syne Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(20, 30, 50, 0.2) 0%, transparent 70%);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-family: var(--font-gothic);
            font-weight: 850;
            font-size: clamp(28px, 4vw, 42px);
            color: var(--text-heading);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .badge {
            font-family: var(--font-mono);
            font-size: 13px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 14px;
            color: var(--accent);
            border-radius: 2px;
        }

        p.lead {
            font-size: 15px;
            color: #8b9bb4;
            font-weight: 300;
        }

        /* Botones de Filtro */
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            font-family: var(--font-mono);
            font-size: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 16px;
            color: var(--text);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--text-heading);
            color: var(--bg);
            border-color: var(--text-heading);
        }

        /* Grid Dinámico de Módulos */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        /* Tarjeta Gótica Minimalista */
        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 24px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 2px; height: 100%;
            background: var(--text-heading);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            border-color: var(--border-glow);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card h3 {
            font-family: var(--font-gothic);
            font-size: 18px;
            color: var(--text-heading);
            margin-bottom: 10px;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        .card .docente {
            font-family: var(--font-mono);
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: block;
        }

        .card p {
            font-size: 14px;
            color: var(--text);
            line-height: 1.6;
            margin-bottom: 16px;
            font-weight: 300;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 15px;
        }

        .tag {
            font-family: var(--font-mono);
            font-size: 11px;
            background: #030407;
            border: 1px solid var(--border);
            padding: 3px 8px;
            color: #94a3b8;
            border-radius: 2px;
        }

        footer {
            margin-top: 60px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 12px;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>Portal de Repaso</h1>
                <p class="lead">Sistema de Archivos y Módulos Académicos // 3.º DS B</p>
            </div>
            <div class="badge">SEC // v0.5-FILTERS</div>
        </header>

        <!-- Botones de Filtrado por Docente -->
        <div class="filters">
            <button class="filter-btn active" data-filter="todos">Ver Todos</button>
            <button class="filter-btn" data-filter="Arcides Canales">Arcides Canales</button>
            <button class="filter-btn" data-filter="Javier Mineros">Javier Mineros</button>
        </div>

        <!-- Contenedor dinámico controlado por JavaScript -->
        <div id="lista-modulos" class="grid"></div>

        <footer>
            INDEL // DESARROLLO DE SOFTWARE
        </footer>
    </div>

    <!-- Enlazamos los datos y la lógica de filtrado -->
    <script src="data/modulos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const contenedor = document.getElementById("lista-modulos");
            const botonesFiltro = document.querySelectorAll(".filter-btn");
            
            function renderModulos(filtro = "todos") {
                if (!contenedor || typeof modulosData === "undefined") return;

                const modulosFiltrados = filtro === "todos" 
                    ? modulosData 
                    : modulosData.filter(mod => mod.docente === filtro);

                contenedor.innerHTML = modulosFiltrados.map(mod => `
                    <div class="card">
                        <span class="docente">Docente: ${mod.docente}</span>
                        <h3>${mod.nombre}</h3>
                        <p>${mod.resumen}</p>
                        <div class="tags">
                            ${mod.herramientas.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                    </div>
                `).join("");
            }

            // Render inicial al cargar la página
            renderModulos("todos");

            // Eventos para los botones de filtro
            botonesFiltro.forEach(boton => {
                boton.addEventListener("click", () => {
                    botonesFiltro.forEach(b => b.classList.remove("active"));
                    boton.classList.add("active");
                    const filtroSeleccionado = boton.getAttribute("data-filter");
                    renderModulos(filtroSeleccionado);
                });
            });
        });
    </script>
</body>
</html>
